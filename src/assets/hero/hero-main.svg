<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!-- PLACEHOLDER — substituir por hero-main.webp exportado do Canva -->
  <!--
    Composição abstrata de movimento: faixas que atravessam o quadro em velocidades
    diferentes, sugerindo corpos em deslocamento. Ocupa o lugar da fotografia
    principal até que o asset real exista.
  -->
  <defs>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#042719" />
      <stop offset="100%" stop-color="#063D2B" />
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4F0E6" stop-opacity="0" />
      <stop offset="45%" stop-color="#F4F0E6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F4F0E6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sweepGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#087A4B" stop-opacity="0" />
      <stop offset="50%" stop-color="#087A4B" stop-opacity="1" />
      <stop offset="100%" stop-color="#087A4B" stop-opacity="0" />
    </linearGradient>
    <clipPath id="frame">
      <rect width="800" height="1000" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="1000" fill="url(#depth)" />

    <!-- Faixas de fundo, lentas -->
    <g opacity="0.35">
      <rect x="-100" y="180" width="1000" height="46" fill="url(#sweepGreen)" transform="rotate(-8 400 200)" />
      <rect x="-100" y="300" width="1000" height="28" fill="url(#sweepGreen)" transform="rotate(-8 400 320)" />
      <rect x="-100" y="720" width="1000" height="38" fill="url(#sweepGreen)" transform="rotate(-8 400 740)" />
    </g>

    <!-- Silhuetas verticais: presença humana sem retrato -->
    <g fill="#080A09" opacity="0.85">
      <path d="M120 1000 L150 520 Q168 470 196 520 L226 1000 Z" />
      <path d="M300 1000 L332 430 Q352 372 384 430 L416 1000 Z" />
      <path d="M470 1000 L498 500 Q516 448 542 500 L570 1000 Z" />
      <path d="M620 1000 L642 590 Q656 552 678 590 L700 1000 Z" />
    </g>

    <!-- Faixas de frente, rápidas: cortam as silhuetas e criam o borrão de movimento -->
    <g opacity="0.9">
      <rect x="-100" y="560" width="1000" height="22" fill="url(#sweep)" transform="rotate(-8 400 580)" />
      <rect x="-100" y="612" width="1000" height="10" fill="url(#sweep)" transform="rotate(-8 400 630)" />
      <rect x="-100" y="470" width="1000" height="14" fill="url(#sweep)" transform="rotate(-8 400 490)" />
    </g>

    <!-- Acento amarelo mínimo, para amarrar à paleta -->
    <rect x="-100" y="660" width="1000" height="6" fill="#FFD500" opacity="0.75" transform="rotate(-8 400 680)" />
  </g>
</svg>
