<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="presentation">
  <!-- PLACEHOLDER — substituir por hero-texture.webp exportado do Canva -->
  <!--
    Azulejo pequeno, repetido por background-repeat. Antes era um SVG esticado
    para a viewport inteira: o navegador rasterizava ~2 milhões de pixels de
    ruído fractal a cada mudança de tamanho. Em 180x180 com uma única oitava, o
    custo é desprezível e o resultado visual é o mesmo — grão não tem escala
    reconhecível.
  -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>
  <rect width="180" height="180" filter="url(#grain)" opacity="0.5" />
</svg>
